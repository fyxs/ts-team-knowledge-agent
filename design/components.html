<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbot components</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      :root {
      /* Surface */
      --bg:                        oklch(0.985 0 0);
      --surface:                   oklch(1 0 0);
      --surface-warm:              oklch(0.965 0 0);

      /* Foreground */
      --fg:                        oklch(0.12 0 0);
      --fg-2:                      oklch(0.38 0 0);
      --muted:                     oklch(0.94 0 0);
      --meta:                      oklch(0.58 0 0);

      /* Border */
      --border:                    oklch(0.9 0 0);
      --border-soft:               oklch(0.88 0 0);

      /* Accent & semantic */
      --accent:                    oklch(0.965 0 0);
      --accent-on:                 oklch(0.12 0 0);
      --accent-hover:              color-mix(in oklab, var(--accent), black 8%);
      --accent-active:             color-mix(in oklab, var(--accent), black 14%);
      --success:                   #16a34a;
      --warn:                      #eab308;
      --danger:                    oklch(0.55 0.15 25);

      /* Typography — families */
      --font-display:              Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-body:                 Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono:                 "Geist Mono", ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

      /* Typography — scale */
      --text-xs:                   0.75rem;
      --text-sm:                   0.875rem;
      --text-base:                 1rem;
      --text-lg:                   1.125rem;
      --text-xl:                   1.25rem;
      --text-2xl:                  1.5rem;
      --text-3xl:                  1.875rem;
      --text-4xl:                  2.25rem;

      /* Typography — rhythm */
      --leading-body:              1.6;
      --leading-tight:             1.2;
      --tracking-display:          -0.025em;

      /* Spacing */
      --space-1:                   4px;
      --space-2:                   8px;
      --space-3:                   12px;
      --space-4:                   16px;
      --space-5:                   20px;
      --space-6:                   24px;
      --space-8:                   32px;
      --space-12:                  48px;

      /* Section rhythm — not applicable in this app shell */
      --section-y-desktop:         96px;
      --section-y-tablet:          68px;
      --section-y-phone:           48px;

      /* Radius — derived from --radius: 0.625rem */
      --radius-sm:                 0.375rem;
      --radius-md:                 0.5rem;
      --radius-lg:                 0.625rem;
      --radius-pill:               9999px;

      /* Elevation */
      --elev-flat:                 none;
      --elev-ring:                 0 0 0 1px var(--border);
      --elev-raised:               0 1px 3px oklch(0 0 0 / 0.05), 0 1px 1px oklch(0 0 0 / 0.03);

      /* Focus */
      --focus-ring:                0 0 0 1px oklch(0.5 0 0), 0 2px 8px -2px oklch(0 0 0 / 0.06);

      /* Motion */
      --motion-fast:               150ms;
      --motion-base:               200ms;
      --ease-standard:             cubic-bezier(0.4, 0, 0.2, 1);

      /* Layout */
      --container-max:             896px;
      --container-gutter-desktop:  16px;
      --container-gutter-tablet:   16px;
      --container-gutter-phone:    8px;
      }
      body { margin: 0; font-family: var(--font-body); color: var(--fg); background: var(--bg); }
      main { max-width: 960px; margin: 0 auto; padding: var(--space-8) var(--space-5); }
      nav { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); border-bottom: 1px solid var(--border-soft); padding-bottom: var(--space-4); }
      .brand { font-weight: 700; font-size: var(--text-lg); }
      .card { margin-top: var(--space-6); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--elev-raised); padding: var(--space-6); }
      .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
      button { border: 1px solid transparent; border-radius: var(--radius-md); padding: 0.7rem 1rem; font: inherit; cursor: pointer; transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard); }
      .primary { background: var(--accent); color: var(--accent-on); }
      .secondary { background: var(--surface-warm); border-color: var(--border); color: var(--fg); }
      input { min-width: 240px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.7rem 0.85rem; font: inherit; color: var(--fg); background: var(--surface); }
      h1 { margin: var(--space-6) 0 var(--space-2); font-size: var(--text-3xl); line-height: var(--leading-tight); }
      p { color: var(--fg-2); line-height: var(--leading-body); }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <div class="brand">Chatbot</div>
        <div class="row"><button class="secondary">Preview</button><button class="primary">Create</button></div>
      </nav>
      <section class="card">
        <h1>Component fixture</h1>
        <p>This fixture gives agents a compact reference for imported tokens, common controls, and card proportions.</p>
        <div class="row">
          <button class="primary">Primary action</button>
          <button class="secondary">Secondary</button>
          <input value="Input value" aria-label="Example input" />
        </div>
      </section>
    </main>
  </body>
</html>
