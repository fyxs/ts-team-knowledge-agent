[project]
name = "ts-team-knowledge-agent"
version = "0.1.0"
description = "Local-first agent for TS team knowledge ingestion and search"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.0", "openpyxl>=3.1", "pydantic-settings>=2.0", "MinerU[pipeline]>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8"]
build = ["pyinstaller>=6.0"]

[project.scripts]
ts-team-kb = "ts_knowledge_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["ts_knowledge_agent*"]

[tool.setuptools.package-data]
ts_knowledge_agent = ["web/**/*"]
