[project]
name = "ts-team-knowledge-agent"
version = "0.1.0"
description = "Local-first agent for TS team knowledge ingestion and search"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.0", "pydantic-settings>=2.0", "MinerU[pdf,docx,pptx,xlsx]>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
ts-team-kb = "ts_knowledge_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["ts_knowledge_agent*"]
